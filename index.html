<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CHIMPS RUNNERS</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#07150d;color:#efffea;font:16px system-ui,Arial;overflow:hidden}
#hud{position:fixed;z-index:5;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#10271ddd;border:1px solid #4b8056;border-radius:14px;padding:10px 13px;backdrop-filter:blur(8px);pointer-events:auto;max-width:min(92vw,360px)}
#brand{font-weight:900;letter-spacing:2px;color:#b9ff9d}
#badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#badges:empty{display:none}
.badge{font-size:11px;border:1px solid #82b57d;border-radius:99px;padding:4px 8px;color:#d7ffd0}
#actions{position:fixed;z-index:6;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:96%;pointer-events:auto}
button{border:1px solid #72a66e;background:#1b4729;color:white;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}
button:active{transform:scale(.97)}button:disabled{opacity:.35}
#modal{display:none;position:fixed;z-index:10;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;overflow:auto}
#modal .panel{width:min(100%,380px);max-width:380px}
#modal input,#modal textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #69966b;background:#07150d;color:white;margin:6px 0;font:13px monospace}
#help{position:fixed;z-index:5;bottom:78px;left:12px;max-width:260px;font-size:12px;color:#e2f5df}
a-scene{position:fixed;inset:0}
</style>
</head>
<body>
<div id="hud">
 <div class="panel"><div id="brand">🐒 CHIMPS RUNNERS</div><div id="badges"></div></div>
 <div class="panel"><button id="menuBtn">MENU</button></div>
</div>
<div id="help" class="panel">Explore the forest. VR: tap Enter VR, then push your hands against the ground, trees and platforms. Phone: use the on-screen buttons.</div>
<div id="actions">
 <button id="forward">▲ MOVE</button><button id="jump">JUMP</button>
 <button id="ventBtn">MOD VENTS</button><button id="toolsBtn" hidden>MOD TOOLS</button><button id="bmBtn" hidden>BADGES</button>
</div>
<div id="modal"><div class="panel">
 <h2 id="modalTitle">CHIMPS RUNNERS</h2><p id="modalText"></p><div id="modalExtra"></div>
 <div style="display:flex;gap:8px;margin-top:12px"><button id="primary">OK</button><button id="close">CLOSE</button></div>
</div></div>
<a-scene renderer="antialias:true; colorManagement:true" vr-mode-ui="enabled:true" background="color:#9ac7d0" fog="type:linear; color:#9ac7d0; near:18; far:90">
 <a-assets>
  <a-mixin id="trunk" geometry="primitive:cylinder; radius:0.42; height:5" material="color:#60402a"></a-mixin>
  <a-mixin id="leaf" geometry="primitive:sphere; radius:2.1" material="color:#245f32"></a-mixin>
 </a-assets>
 <a-sky color="#9ac7d0"></a-sky>
 <a-plane rotation="-90 0 0" width="180" height="180" color="#315b2d" material="roughness:1"></a-plane>
 <a-light type="ambient" color="#d7ffd8" intensity="0.7"></a-light>
 <a-light type="directional" position="-3 10 4" intensity="0.8"></a-light>
 <a-entity id="forest"></a-entity>
 <a-entity id="player" position="0 0 8">
  <a-camera id="camera" position="0 1.6 0" wasd-controls="acceleration:22" look-controls>
   <a-cursor color="#e6ffcc" raycaster="objects:.clickable"></a-cursor>
  </a-camera>
  <a-entity laser-controls="hand:left"></a-entity><a-entity laser-controls="hand:right"></a-entity>
 </a-entity>
 <a-entity id="vent" position="0 0.08 -8">
  <a-box width="2.3" height=".18" depth="2.3" color="#4d5550" material="metalness:.7;roughness:.4"></a-box>
  <a-box position="0 .14 0" width="1.65" height=".08" depth="1.65" color="#1b2520" class="clickable" id="ventHatch"></a-box>
  <a-text value="MOD VENT" align="center" color="#ffffff" position="0 .25 0" width="4"></a-text>
 </a-entity>
 <a-entity id="modRoom" position="0 -30 0">
  <a-box position="0 0 0" width="12" height=".3" depth="12" color="#263b32"></a-box>
  <a-box position="0 2.5 -6" width="12" height="5" depth=".3" color="#344d3d"></a-box>
  <a-text value="MODERATOR VENTS" align="center" position="0 3.5 -5.7" width="8" color="#baff9c"></a-text>
 </a-entity>
</a-scene>
<script src="chimps-config.js?v=ownerfix2"></script>
<script src="chimps-identity.js?v=ownerfix2"></script>
<script src="badge-manager.js?v=ownerfix2"></script>
<script src="player-name-tags.js?v=2"></script>
<script>
(function(){
 const $=id=>document.getElementById(id),ID=window.ChimpsID,modal=$('modal');
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function show(title,msg,extra=''){$('modalTitle').textContent=title;$('modalText').textContent=msg;$('modalExtra').innerHTML=extra;modal.style.display='flex'}
 function hide(){modal.style.display='none'}
 $('close').onclick=hide;$('primary').onclick=hide;
 const badgeHTML=k=>{const b=ID.badge(k);return b?'<span class="badge">'+b.emoji+' '+esc(b.label)+'</span>':''};
 function renderHud(){const m=ID.me();$('badges').innerHTML=m.badges.map(badgeHTML).join('');$('toolsBtn').hidden=!m.perms.includes('tools');$('bmBtn').hidden=!m.perms.includes('manage_badges')}
 ID.on(renderHud);
 ID.init().then(renderHud).catch(e=>console.warn('Identity unavailable; playing without badges.',e));
 function requireMod(){
  if(!ID.has('vents')){show('Access denied','Only the Owner, Co-Owners and Moderators can enter the moderator vents.');return false}
  $('player').setAttribute('position','0 -28 0');show('Welcome to the vents','Your CHIMPS RUNNERS badge gives you vent access.');return true
 }
 $('ventBtn').onclick=requireMod;$('ventHatch').addEventListener('click',requireMod);
 $('toolsBtn').onclick=()=>{if(ID.has('tools'))show('Moderator tools','Ban and kick actions are not enabled yet. They need your own server (Path B) to safely affect other players.')};
 $('bmBtn').onclick=()=>{if(ID.has('manage_badges')&&window.ChimpsBadgeManager)window.ChimpsBadgeManager.open()};
 function profile(){
  const m=ID.me();
  show('My Profile','',
   '<div>Name</div><input id="pfName" maxlength="20" value="'+esc(m.name)+'"><button id="pfSave">SAVE NAME</button>'+
   '<div style="margin-top:8px">Badges</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">'+(m.badges.length?m.badges.map(badgeHTML).join(''):'<i>No badges yet</i>')+'</div>'+
   '<div>Player Code (send this to the Owner)</div><textarea id="pfCode" rows="3" readonly>'+esc(m.code)+'</textarea><button id="pfCopy">COPY CODE</button>'+
   '<button id="ownerSetupBtn" style="margin-top:10px">OWNER SETUP</button>'+
    '<details style="margin-top:8px"><summary>Identity backup / restore</summary><p style="font-size:12px">Save a backup to keep your identity if you clear browser data or switch devices. Keep it private.</p><textarea id="pfBak" rows="3" placeholder="Backup text appears here, or paste one to restore"></textarea><button id="pfExp">SHOW MY BACKUP</button><button id="pfImp">RESTORE</button></details>');
  $('pfSave').onclick=()=>{ID.setName($('pfName').value);profile()};
  $('pfCopy').onclick=async()=>{const t=$('pfCode');t.select();t.setSelectionRange(0,1e9);try{await navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}};
  $('pfExp').onclick=()=>{$('pfBak').value=ID.exportId()};
  $('pfImp').onclick=async()=>{try{await ID.importId($('pfBak').value);profile()}catch(e){alert(e.message||e)}};
 }
 $('menuBtn').onclick=()=>show('CHIMPS RUNNERS','Explore the forest, find the vent hatch, and earn badges.','<p>VR: tap Enter VR. Push your hands against the ground, trees and platforms to move and climb. A / X = jump.</p><p>Phone: hold MOVE and tap JUMP. Desktop: WASD, mouse and Space.</p><button id="profBtn">MY PROFILE</button>');
 document.addEventListener('click',e=>{
   if(e.target&&e.target.id==='profBtn')profile();
   if(e.target&&e.target.id==='ownerSetupBtn'){
    if(window.ChimpsBadgeManager)window.ChimpsBadgeManager.setup();
    else alert('Owner setup is still loading. Please reload the game.');
   }
  });
 // Movement is handled only by gorilla-locomotion.js to avoid duplicate movement loops.
})();
</script>
<script src="forest-map.js?v=3"></script>
</body>
</html>
